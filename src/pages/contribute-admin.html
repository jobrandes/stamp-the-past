<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Reports · Stamp the Past test</title>
<link rel="stylesheet" href="/fonts/fonts.css"><style>:root{--bg:#EDF0F3;--fg:#13202C;--mut:#53626F;--ac:#1B58B8;--line:#C9D1D9;--card:#fff;--bad:#B3322B;--ok:#17653A}@media(prefers-color-scheme:dark){:root{--bg:#0D141B;--fg:#E9EFF4;--mut:#9AAAB8;--ac:#7BB0FF;--line:#2B3946;--card:#16222F;--bad:#FF8A80;--ok:#59C58E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:1.0625rem/1.5 "Public Sans",system-ui,sans-serif;padding:20px 16px 64px}main{max-width:720px;margin:0 auto;overflow-wrap:anywhere}h1{font:700 2.2rem/1 "Big Shoulders Display",sans-serif;text-transform:uppercase;margin:.2em 0}.mut{color:var(--mut)}a{color:var(--ac)}
input{width:100%;min-height:48px;font:inherit;color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}button{min-height:48px;font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--ac);color:#fff;padding:0 18px;cursor:pointer}@media(prefers-color-scheme:dark){button{color:#08121c}}button.ghost{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.row{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0;display:grid;gap:8px}.row b{font-size:1.05rem}.tag{display:inline-block;font:500 .75rem "IBM Plex Mono",monospace;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}.tag.h{color:var(--bad);border-color:var(--bad)}.tag.v{color:var(--ok);border-color:var(--ok)}.err{color:var(--bad);font-weight:600}
</style></head><body><main>
<p class="mut" style="margin:0;font:500 .75rem 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.1em">Stamp the Past · community test</p>
<h1>Reported places</h1>
<p class="mut">Private page for the owner. Paste the admin key to see which places people reported. Three reports hide a place in the app. Unhide puts it back for good. The key stays in this tab only and is never written to storage.</p>
<label for="k" class="mut">Admin key</label><input id="k" type="password" autocomplete="off" spellcheck="false">
<p><button id="go" type="button">Show reports</button></p>
<p class="err" id="err" role="alert" hidden></p><div id="list" aria-live="polite"></div>
</main><script>
(function(){
var names={};function $(i){return document.getElementById(i);}
function hdr(){return {'x-admin-key':$('k').value.trim()};}
function load(){$('err').hidden=true;$('list').innerHTML='';
  fetch('/community/places.json').then(function(r){return r.ok?r.json():{};}).catch(function(){return {};}).then(function(j){names={};(j.packs||[]).forEach(function(p){(p.stops||[]).forEach(function(st){var k=((st.then&&st.then.ph)||(st.now&&st.now.ph)||{}).k||'';names[k.replace(/^cm_/,'').slice(0,8)]={n:st.name,c:p.name};});});(j.tours||[]).forEach(function(t){(t.stops||[]).forEach(function(st){var k=(st.ph||{}).k||'';names[k.replace(/^cm_/,'').slice(0,8)]={n:st.name,c:t.name};});});
    return fetch('/api/community/reports',{headers:hdr()});}).then(function(r){if(!r.ok){throw new Error(r.status===404?'That key was not accepted.':'Could not load reports.');}return r.json();}).then(function(j){var L=$('list');
      if(!j.reports.length){L.innerHTML='<p class="mut">No place has been reported.</p>';return;}
      j.reports.forEach(function(x){var nm=names[x.id]||{n:'Place '+x.id,c:''},d=document.createElement('div');d.className='row';
        var b=document.createElement('b');b.textContent=nm.n;d.appendChild(b);var m=document.createElement('span');m.className='mut';m.textContent=(nm.c?nm.c+' · ':'')+x.n+' report'+(x.n===1?'':'s')+(x.last?' · last '+x.last.slice(0,10):'');d.appendChild(m);
        var t=document.createElement('span');t.className='tag '+(x.hidden?'h':'v');t.textContent=x.hidden?'Hidden in the app':(x.cleared?'Visible (you cleared it)':'Visible');d.appendChild(t);
        if(x.hidden){var u=document.createElement('button');u.type='button';u.textContent='Unhide this place';u.addEventListener('click',function(){u.disabled=true;fetch('/api/community/unhide/'+x.id,{method:'POST',headers:hdr()}).then(function(r){if(!r.ok)throw 0;load();}).catch(function(){u.disabled=false;$('err').hidden=false;$('err').textContent='Could not unhide. Try again.';});});d.appendChild(u);}
        L.appendChild(d);});
    }).catch(function(e){$('err').hidden=false;$('err').textContent=e&&e.message?e.message:'Could not load reports.';});}
$('go').addEventListener('click',load);$('k').addEventListener('keydown',function(e){if(e.key==='Enter')load();});
})();
</script></body></html>
